<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Results - Colosseum</title>
  <link rel="icon" type="image/x-icon" href="/assets/icon.png">
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-900">
  <header class="p-4 bg-gray-200 shadow flex justify-between items-center border-b border-gray-500">
    <h1 class="text-xl font-semibold">Waiting for Others...</h1>
    <div class="flex flex-row gap-2 items-center">
      <a class="px-3 py-1 bg-gray-600 text-white rounded hover:bg-gray-700" href="/pages/index.html">
        Exit
      </a>
      <a class="px-3 py-1 bg-gray-600 text-white rounded hover:bg-gray-700" href="/api/return-to-lobby">
        Lobby
      </a>
    </div>
  </header>

  <section hx-get="/api/poll-start" hx-trigger="every 5s"></section>

  <main class="max-w-4xl mx-auto p-6 text-center space-y-6">
    <div class="bg-white rounded-xl shadow p-6" hx-get="/api/poll-stats" hx-trigger="every 3s" hx-target="#leaderboard"
      hx-swap="outerHTML">
      <h2 class="text-lg font-semibold mb-4">Leaderboard</h2>
      <div id="leaderboard" class="space-y-2">
      </div>
    </div>
  </main>

  <footer class="fixed bottom-0 left-1/2 -translate-x-1/2 text-gray-500 text-sm p-4">
    © 2025 Colosseum
  </footer>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Results - Colosseum</title>
  <link rel="icon" type="image/x-icon" href="/assets/icon.png">
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-900">
  <header class="p-4 bg-white shadow flex justify-between items-center">
    <h1 class="text-xl font-semibold">Waiting for Others...</h1>
    <button class="px-3 py-1 bg-gray-600 text-white rounded hover:bg-gray-700" hx-get="lobby.html" hx-target="body"
      hx-swap="outerHTML">
      Exit
    </button>
  </header>

  <main class="max-w-4xl mx-auto p-6 text-center space-y-6">
    <div class="bg-white rounded-xl shadow p-6">
      <h2 class="text-lg font-semibold mb-2">Your Submission</h2>
      <p class="text-gray-700">Running test cases...</p>
      <div class="flex justify-center mt-4">
        <div class="w-6 h-6 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow p-6" hx-get="/leaderboard" hx-trigger="every 3s" hx-target="#leaderboard"
      hx-swap="outerHTML">
      <h2 class="text-lg font-semibold mb-4">Leaderboard</h2>
      <div id="leaderboard" class="space-y-2">
        <div class="flex justify-between text-gray-700">
          <span>Alice</span> <span>Passed ✅</span>
        </div>
        <div class="flex justify-between text-gray-700">
          <span>You</span> <span>Running ⏳</span>
        </div>
        <div class="flex justify-between text-gray-700">
          <span>Bob</span> <span>Passed ✅</span>
        </div>
      </div>
    </div>
  </main>
</body>

</html>

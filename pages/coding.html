<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coding - Colosseum</title>
  <link rel="icon" type="image/x-icon" href="/assets/icon.png">
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-900">
  <header class="p-4 bg-gray-200 shadow flex justify-between items-center border-b border-gray-500">
    <h1 class="text-xl font-semibold">Binary Trees - Fastest</h1>
    <div class="flex flex-row gap-2 items-center">
      <section id="ctrl-panel" hx-get="/api/coding-ctrl-panel" hx-trigger="load"></section>
      <a class="px-3 py-1 bg-gray-600 text-white rounded hover:bg-gray-700" href="/pages/index.html">
        Exit
      </a>
    </div>
  </header>

  <section hx-get="/api/poll-end" hx-trigger="every 5s"></section>

  <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
    <section id="problem" hx-get="/api/problem" hx-trigger="load"></section>

    <section class="bg-white rounded-xl shadow flex flex-col">
      <h2 class="p-3 text-lg font-semibold">Editor</h2>
      <div id="editor" class="h-96 border border-gray-700 overflow-auto"></div>
      <div class="p-3 flex gap-2 border-t justify-end">
        <form id="submit-form" action="/api/submit" method="post">
          <input type="hidden" name="code" id="submit-code">
          <button class="px-3 py-1 bg-green-600 text-white rounded hover:bg-green-700" type="submit">
            Submit
          </button>
        </form>
        <form id="run-form" hx-post="/run" hx-target="#output" hx-swap="innerHTML">
          <input type="hidden" name="code" id="run-code">
          <button class="px-3 py-1 bg-blue-600 text-white rounded hover:bg-blue-700" type="submit">
            Run
          </button>
        </form>
      </div>
    </section>
    <section id="output" class="col-span-full bg-white rounded-xl shadow p-4">
      <h3 class="font-semibold mb-2">Output</h3>
      <p class="text-gray-500">No output yet. Run your code to see results.</p>
    </section>
  </main>

  <footer class="fixed bottom-0 left-1/2 -translate-x-1/2 text-gray-500 text-sm p-4">
    © 2025 Colosseum
  </footer>
</body>

<script type="module">
  import { EditorView, keymap, drawSelection, lineNumbers } from "https://esm.sh/@codemirror/view@6"
  import { defaultHighlightStyle, syntaxHighlighting, indentOnInput, bracketMatching } from "https://esm.sh/@codemirror/language@6"
  import { defaultKeymap, history, historyKeymap } from "https://esm.sh/@codemirror/commands@6"
  import { autocompletion, completionKeymap, closeBrackets, closeBracketsKeymap } from "https://esm.sh/@codemirror/autocomplete@6"
  import { oneDark } from "https://esm.sh/@codemirror/theme-one-dark@6";
  import { python } from "https://esm.sh/@codemirror/lang-python@6";

  new EditorView({
    parent: document.getElementById("editor"),
    doc: "",
    extensions: [
      EditorView.theme({
        "&": { height: "100%" }
      }),
      lineNumbers(),
      history(),
      indentOnInput(),
      python(),
      syntaxHighlighting(defaultHighlightStyle, { fallback: true }),
      bracketMatching(),
      closeBrackets(),
      autocompletion(),
      drawSelection(),
      keymap.of([
        ...defaultKeymap,
        ...historyKeymap,
        ...closeBracketsKeymap,
        ...completionKeymap,
      ]),
      oneDark,
      EditorView.updateListener.of(update => {
        if (update.docChanged) {
          const code = update.state.doc.toString();
          document.getElementById("submit-code").value = code;
          document.getElementById("run-code").value = code;
        }
      })
    ]
  })
</script>

</html>

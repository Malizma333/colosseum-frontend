<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lobby - Colosseum</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-900">
  <header class="p-4 bg-white shadow flex justify-between items-center">
    <h1 class="text-xl font-semibold">Colosseum Lobby</h1>
    <button class="px-3 py-1 bg-gray-600 text-white rounded hover:bg-gray-700" hx-get="index.html" hx-target="body"
      hx-swap="outerHTML">
      Exit
    </button>
  </header>

  <section hx-get="/api/poll-start" hx-trigger="every 5s"></section>

  <main class="max-w-4xl mx-auto p-6 space-y-6">
    <!-- Lobby Info -->
    <div class="flex items-center">
      <input type="text" readonly id="lobby-link" class="flex-grow border rounded-l p-2 font-mono bg-gray-50" />
      <button onclick="navigator.clipboard.writeText(document.getElementById('lobby-link').value)"
        class="px-4 py-2 bg-blue-600 text-white rounded-r hover:bg-blue-700">
        Copy
      </button>
    </div>

    <!-- Players List -->
    <section id="player-list" class="bg-white rounded-xl shadow p-6" hx-get="/api/lobby/ABC123/players"
      hx-trigger="load, every 5s" hx-swap="outerHTML">
      <h2 class="text-lg font-semibold mb-4">Players</h2>
      <ul class="space-y-2 text-gray-700">
        <li>Bob (Host)</li>
        <li>You</li>
      </ul>
    </section>


    <form action="/api/start" method="post">
     <input type="text" id="my-text" name="my-text">
     <input type="submit" value="submit">
    </form>
    <p class="text-gray-600">Waiting for host to start the match...</p>
  </main>
</body>

<script>
  document.getElementById('lobby-link').setAttribute("value", window.location)
</script>

</html>
